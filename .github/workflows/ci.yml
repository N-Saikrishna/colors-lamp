name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install linting tools
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: Lint JavaScript
        if: ${{ !cancelled() }}
        run: npm run lint:js
